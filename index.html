<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Don Max - Buffet</title>

    <link rel="icon" type="image/png" href="logo.png">
    <link rel="apple-touch-icon" href="logo.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Don Max">
    <meta name="application-name" content="Don Max">
    <meta name="theme-color" content="#D32F2F">

    <link rel="manifest" href="manifest.json">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        html, body {
            width: 100vw;
            height: 100vh;
            overflow: hidden !important;
            background-color: #F8F9FA;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        /* CONTAINER DO STREAMLIT (TELA CHEIA) */
        .app-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            border: none;
            z-index: 1;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        /* BARRA DE MENU FIXA LITERALMENTE NO MEIO DA TELA */
        .middle-navbar {
            position: fixed !important;
            top: 50% !important;
            left: 50% !important;
            transform: translate(-50%, -50%) !important;
            width: 290px !important;
            height: 65px !important;
            background-color: #D32F2F !important;
            border-radius: 25px !important; /* Cartão Arredondado */
            box-shadow: 0px 10px 30px rgba(0, 0, 0, 0.4) !important;
            z-index: 99999999 !important; /* Prioridade máxima sobre tudo */
            display: flex !important;
            align-items: center !important;
            justify-content: space-around !important;
            padding: 0 10px !important;
            border: 2px solid #FFFFFF !important;
        }

        .nav-item {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
        }

        .nav-btn {
            width: 70px;
            height: 48px;
            background: transparent;
            border: none;
            border-radius: 16px;
            color: rgba(255, 255, 255, 0.8);
            font-size: 1.4rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        /* DESTAQUE DA ABA ATIVA (CAIXA BRANCA FLUTUANTE) */
        .nav-btn.active {
            background-color: #FFFFFF !important;
            color: #D32F2F !important;
            box-shadow: 0px 4px 12px rgba(0, 0, 0, 0.25) !important;
        }
    </style>
</head>
<body>

    <!-- APLICAÇÃO STREAMLIT -->
    <div class="app-container">
        <!-- Substitua a URL abaixo pela URL exata do seu Streamlit caso tenha mudado -->
        <iframe id="streamlit-frame" src="https://donmax-buffet.streamlit.app/?embed=true&aba=pesagem"></iframe>
    </div>

    <!-- MENU LITERALMENTE NO MEIO DA TELA -->
    <div class="middle-navbar">
        <div class="nav-item">
            <button class="nav-btn active" onclick="navegar('pesagem', this)">🏠</button>
        </div>
        <div class="nav-item">
            <button class="nav-btn" onclick="navegar('historico', this)">📋</button>
        </div>
        <div class="nav-item">
            <button class="nav-btn" onclick="navegar('config', this)">👤</button>
        </div>
    </div>

    <script>
        const STREAMLIT_BASE_URL = "https://donmax.streamlit.app/?embed=true";

        function navegar(aba, element) {
            // Alterna destaque do botão ativo
            const buttons = document.querySelectorAll('.nav-btn');
            buttons.forEach(btn => btn.classList.remove('active'));
            element.classList.add('active');

            // Atualiza o iframe do Streamlit com a nova aba
            const iframe = document.getElementById('streamlit-frame');
            iframe.src = STREAMLIT_BASE_URL + "&aba=" + aba;
        }
    </script>
</body>
</html>
