<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Don Max - Buffet</title>

    <!-- Metadados PWA para o Celular -->
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="apple-touch-icon" href="logo.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Don Max">
    <meta name="application-name" content="Don Max">
    <meta name="theme-color" content="#FFFFFF">

    <link rel="manifest" href="manifest.json">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden !important;
            background-color: #FFFFFF;
        }

        /* Envolvente com trava estrita de transbordamento */
        .wrapper {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden !important;
        }

        /* Iframe ajustado para empurrar o rodapé para baixo da tela */
        iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: calc(100% + 80px) !important;
            border: none;
        }

        /* Regra específica para quando o App é aberto pelo atalho/PWA instalado */
        @media (display-mode: standalone) {
            iframe {
                height: calc(100% + 100px) !important;
                margin-bottom: -100px !important;
            }
        }
    </style>
</head>
<body>

    <div class="wrapper">
        <!-- Substitua a URL abaixo pela URL real do seu app no Streamlit caso necessário -->
        <iframe src="https://donmax.streamlit.app/?embed=true"></iframe>
    </div>

</body>
</html>
