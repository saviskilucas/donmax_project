<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Don Max - Buffet</title>

    <link rel="icon" type="image/png" href="logo.png">
    <link rel="apple-touch-icon" href="logo.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Don Max">
    <meta name="application-name" content="Don Max">
    <meta name="theme-color" content="#D32F2F">

    <link rel="manifest" href="manifest.json">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden !important;
            background-color: #F8F9FA;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        /* CONTAINER DO STREAMLIT */
        .app-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: calc(100% - 65px);
            border: none;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        /* RODAPÉ FLUTUANTE MODERNO (DESIGN DA FOTO) */
        .navbar-bottom {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            width: 100vw;
            height: 65px;
            background-color: #D32F2F;
            border-radius: 20px 20px 0 0;
            box-shadow: 0px -6px 20px rgba(0, 0, 0, 0.2);
            z-index: 9999999;
            display: flex;
            align-items: center;
            justify-content: space-around;
            padding: 0 15px;
        }

        .nav-item {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
        }

        .nav-btn {
            width: 80%;
            height: 46px;
            background: transparent;
            border: none;
            border-radius: 14px;
            color: rgba(255, 255, 255, 0.75);
            font-size: 1.4rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease-in-out;
        }

        /* CAIXINHA BRANCA EM DESTAQUE NA ABA ATIVA */
        .nav-btn.active {
            background-color: #FFFFFF;
            color: #D32F2F;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.2);
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Substitua abaixo pela URL real do seu Streamlit -->
        <iframe id="streamlit-frame" src="https://donmax-buffet.streamlit.app/?embed=true&aba=pesagem"></iframe>
    </div>

    <!-- RODAPÉ FIXO EXTERNO -->
    <div class="navbar-bottom">
        <div class="nav-item">
            <button class="nav-btn active" onclick="navegar('pesagem', this)">🏠</button>
        </div>
        <div class="nav-item">
            <button class="nav-btn" onclick="navegar('historico', this)">📋</button>
        </div>
        <div class="nav-item">
            <button class="nav-btn" onclick="navegar('config', this)">👤</button>
        </div>
    </div>

    <script>
        // URL Base do seu Streamlit
        const STREAMLIT_BASE_URL = "https://donmax.streamlit.app/?embed=true";

        function navegar(aba, element) {
            // Alterna destaque do botão ativo
            const buttons = document.querySelectorAll('.nav-btn');
            buttons.forEach(btn => btn.classList.remove('active'));
            element.classList.add('active');

            // Atualiza o iframe do Streamlit com a nova aba
            const iframe = document.getElementById('streamlit-frame');
            iframe.src = STREAMLIT_BASE_URL + "&aba=" + aba;
        }
    </script>
</body>
</html>
