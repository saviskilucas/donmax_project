<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Don Max - Buffet</title>

    <!-- Metadados PWA -->
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="apple-touch-icon" href="logo.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Don Max">
    <meta name="application-name" content="Don Max">
    <meta name="theme-color" content="#121212">

    <link rel="manifest" href="manifest.json">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100vw !important;
            height: 100vh !important;
            height: 100dvh !important;
            margin: 0 !important;
            padding: 0 !important;
            border: none !important;
            outline: none !important;
            overflow: hidden !important;
            background-color: #121212 !important;
            -webkit-user-select: none;
            user-select: none;
        }

        .app-wrapper {
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            right: 0 !important;
            bottom: 0 !important;
            width: 100vw !important;
            height: 100vh !important;
            height: 100dvh !important;
            margin: 0 !important;
            padding: 0 !important;
            overflow: hidden !important;
            background-color: #121212 !important;
        }

        /* O IFRAME É APLIQUADO COM MARGEM NEGATIVA PARA CORTAR AS BORDAS DO EMBED DO STREAMLIT */
        iframe {
            position: absolute !important;
            top: -4px !important;              /* Corta a borda branca do topo */
            left: -4px !important;             /* Corta a borda branca da esquerda */
            width: calc(100% + 8px) !important;/* Compensa a largura extra das laterais */
            height: calc(100% + 60px) !important; /* Compensa o topo + esconde a barra inferior */
            border: none !important;
            outline: none !important;
            margin: 0 !important;
            padding: 0 !important;
            display: block !important;
            background-color: #121212 !important;
        }
    </style>
</head>
<body>

    <div class="app-wrapper">
        <iframe src="https://donmax.streamlit.app/?embed=true"></iframe>
    </div>

</body>
</html>
