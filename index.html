<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Don Max - Buffet</title>

    <!-- Metadados PWA para o Celular -->
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="apple-touch-icon" href="logo.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Don Max">
    <meta name="application-name" content="Don Max">
    <meta name="theme-color" content="#FFFFFF">

    <link rel="manifest" href="manifest.json">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden !important;
            background-color: #FFFFFF;
        }

        /* Envolvente que esconde o rodapé cortando a área inferior do iframe */
        .wrapper {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            overflow: hidden !important;
        }

        iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            /* Aumenta a altura para jogar o rodapé do Streamlit para fora da tela */
            height: calc(100% + 60px) !important;
            border: none;
        }
    </style>
</head>
<body>

    <div class="wrapper">
        <!-- Substitua a URL abaixo pela URL real do seu app no Streamlit -->
        <iframe src="https://donmax.streamlit.app/?embed=true"></iframe>
    </div>

</body>
</html>
