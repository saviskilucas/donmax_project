<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Don Max - Buffet</title>

    <!-- Metadados PWA -->
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="apple-touch-icon" href="logo.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Don Max">
    <meta name="application-name" content="Don Max">
    <meta name="theme-color" content="#121212">

    <link rel="manifest" href="manifest.json">

    <style>
        /* ZERA TOTALMENTE AS MARGENS E PREENCHE COM MODO ESCURO */
        html, body {
            width: 100% !important;
            height: 100% !important;
            margin: 0 !important;
            padding: 0 !important;
            border: 0 !important;
            outline: 0 !important;
            overflow: hidden !important;
            background-color: #121212 !important;
            -webkit-user-select: none;
            user-select: none;
        }

        /* CONTAINER FIXO DE COBERTURA TOTAL */
        .app-wrapper {
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            right: 0 !important;
            bottom: 0 !important;
            width: 100vw !important;
            height: 100vh !important;
            height: 100dvh !important;
            margin: 0 !important;
            padding: 0 !important;
            border: 0 !important;
            overflow: hidden !important;
            background-color: #121212 !important;
        }

        /* IFRAME SEM BORDAS E LIGEIRAMENTE ESTICADO PARA CORTAR RESÍDUOS */
        iframe {
            position: absolute !important;
            top: 0 !important;
            left: -1px !important; /* Ajuste milimétrico para cortar linhas laterais */
            width: calc(100% + 2px) !important; /* Compensa o ajuste lateral */
            height: calc(100% + 55px) !important;
            border: none !important;
            border: 0 !important;
            outline: none !important;
            margin: 0 !important;
            padding: 0 !important;
            display: block !important;
            background-color: #121212 !important;
        }
    </style>
</head>
<body>

    <div class="app-wrapper">
        <iframe src="https://donmax.streamlit.app/?embed=true"></iframe>
    </div>

</body>
</html>
